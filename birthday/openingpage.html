<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Something Special... ✨</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #2c3e50 50%, #0f0c20 100%);
            --cute-pink: #ff7675;
            --cute-gold: #ffeaa7;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* Ambient Twinkling Canvas Background */
        .ambient-sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2.5s infinite ease-in-out;
        }

        /* Main Container Frame */
        .timer-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: floatContainer 4s infinite ease-in-out;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Responsive Timer Grid Layout */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 16px 8px;
            border-radius: 18px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .time-box:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
        }

        .time-num {
            font-size: 36px;
            font-weight: bold;
            color: var(--cute-gold);
            text-shadow: 0 0 10px rgba(255, 234, 167, 0.4);
            line-height: 1.1;
        }

        .time-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
            color: #dfe6e9;
            opacity: 0.8;
        }

        /* Hidden Unlock Wrapper Area */
        .unlock-area {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .unlock-area.revealed {
            max-height: 200px;
            opacity: 1;
            margin-top: 30px;
        }

        .pass-input {
            width: 80%;
            max-width: 28px;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 50px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
            width: 260px;
        }

        .pass-input:focus {
            border-color: var(--cute-pink);
            box-shadow: 0 0 15px rgba(255, 118, 117, 0.4), inset 0 4px 10px rgba(0,0,0,0.3);
        }

        .submit-btn {
            margin-top: 15px;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--cute-pink) 0%, #e84393 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 118, 117, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 118, 117, 0.6);
        }

        .error-hint {
            color: #ff7675;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }

        /* Keyframe Animations */
        @keyframes floatContainer {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Smart Mobile Adaptation Scaling Rules */
        @media (max-width: 480px) {
            h1 { font-size: 20px; }
            .time-num { font-size: 26px; }
            .time-label { font-size: 9px; }
            .timer-container { padding: 30px 15px; }
            .pass-input { width: 220px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="ambient-sky" id="starfield"></div>

    <div class="timer-container">
        <h1 id="timer-title">Counting down to a beautiful moment... 🌸</h1>
        
        <div class="countdown-grid">
            <div class="time-box">
                <div id="days" class="time-num">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div id="hours" class="time-num">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div id="minutes" class="time-num">00</div>
                <div class="time-label">Mins</div>
            </div>
            <div class="time-box">
                <div id="seconds" class="time-num">00</div>
                <div class="time-label">Secs</div>
            </div>
        </div>

        <!-- The secret sliding drawer container -->
        <div id="lock-panel" class="unlock-area">
            <input type="password" id="secret-passcode" class="pass-input" placeholder="Enter Magic Password...">
            <button class="submit-btn" onclick="validateKeyGate()">Unlock Mystery 🔐</button>
            <div id="error-msg" class="error-hint"></div>
        </div>
    </div>

    <script>
        // CONFIGURATION DATA SETTINGS
        const targetTargetDateString = "2026-07-15T00:00:00"; // Target Release Frame
        const systemValidationCode = "9392636600";
        const internalTargetFileName = "delivery.html"; // <-- Replace this with your exact animation filename!

        let verificationDrawerUnlocked = false;
        const targetDate = new Date(targetTargetDateString).getTime();

        window.onload = function() {
            generateStars();
            initiateSystemTimer();
            // Bind keyboard Enter key
            document.getElementById('secret-passcode').addEventListener('keyup', function(e) {
                if(e.key === 'Enter') validateKeyGate();
            });
        };

        function generateStars() {
            const container = document.getElementById('starfield');
            const density = 60;
            for(let i=0; i<density; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }

        function initiateSystemTimer() {
            const clockLoop = setInterval(function() {
                const now = new Date().getTime();
                const delta = targetDate - now;

                if (delta <= 0) {
                    clearInterval(clockLoop);
                    document.getElementById('days').innerText = "00";
                    document.getElementById('hours').innerText = "00";
                    document.getElementById('minutes').innerText = "00";
                    document.getElementById('seconds').innerText = "00";
                    revealLockDrawer();
                    return;
                }

                const d = Math.floor(delta / (1000 * 60 * 60 * 24));
                const h = Math.floor((delta % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((delta % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((delta % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(d).padStart(2, '0');
                document.getElementById('hours').innerText = String(h).padStart(2, '0');
                document.getElementById('minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('seconds').innerText = String(s).padStart(2, '0');
            }, 1000);
        }

        function revealLockDrawer() {
            if(verificationDrawerUnlocked) return;
            verificationDrawerUnlocked = true;
            document.getElementById('timer-title').innerText = "The moment has arrived! ✨";
            document.getElementById('lock-panel').classList.add('revealed');
        }

        function validateKeyGate() {
            const typedVal = document.getElementById('secret-passcode').value.trim();
            const logElement = document.getElementById('error-msg');

            if (typedVal === systemValidationCode) {
                logElement.style.color = "#2ed573";
                logElement.innerText = "Access Granted! Opening your surprise... ❤️";
                setTimeout(function() {
                    window.location.href = internalTargetFileName;
                }, 1500);
            } else {
                logElement.innerText = "Mmm... that's not the right password. Try again! 🤫";
                document.getElementById('secret-passcode').value = "";
            }
        }
    </script>
</body>
</html>
