<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Memories Locker 🔐</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                    #ffd1dc 0%,
                    #e6e6fa 25%,
                    #ffefd5 50%,
                    #e6e6fa 75%,
                    #ffd1dc 100%);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Magic Sparkles */
        .magic-sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Floating Hearts Background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            bottom: -10vh;
            left: var(--left, 50%);
            font-size: var(--size, 1.5rem);
            animation: floatUp var(--float-duration, 8s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) translateX(30px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Locker Screen Container */
        .locker-container {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .locker-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 3rem 2.5rem;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 2px solid rgba(255, 182, 193, 0.6);
            animation: fadeInScale 1.2s ease;
        }

        .locker-box h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #ff69b4;
            margin-bottom: 0.5rem;
        }

        .locker-box p {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .pin-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 10px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: #4a4a4a;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.3);
        }

        .unlock-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.15rem;
            background: linear-gradient(45deg, #ff69b4, #da70d6);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        .unlock-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.95rem;
            margin-top: 1rem;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.4); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(45deg, #ff69b4, #da70d6); border-radius: 6px; }
    </style>
</head>

<body>
    <div class="magic-sparkles"></div>
    
    <!-- Full Background Scattered Hearts -->
    <div class="floating-hearts">
        <div class="heart" style="--left: 5%; --float-duration: 7s; --delay: 0s; --size: 1.2rem;">💝</div>
        <div class="heart" style="--left: 15%; --float-duration: 9s; --delay: 2s; --size: 1.5rem;">💖</div>
        <div class="heart" style="--left: 25%; --float-duration: 6s; --delay: 1s; --size: 1rem;">💗</div>
        <div class="heart" style="--left: 35%; --float-duration: 10s; --delay: 4s; --size: 1.8rem;">💓</div>
        <div class="heart" style="--left: 45%; --float-duration: 8s; --delay: 3s; --size: 1.3rem;">💕</div>
        <div class="heart" style="--left: 55%; --float-duration: 7s; --delay: 0.5s; --size: 1.6rem;">💝</div>
        <div class="heart" style="--left: 65%; --float-duration: 9s; --delay: 2.5s; --size: 1.1rem;">💖</div>
        <div class="heart" style="--left: 75%; --float-duration: 6s; --delay: 1.5s; --size: 1.4rem;">💗</div>
        <div class="heart" style="--left: 85%; --float-duration: 11s; --delay: 3.5s; --size: 1.7rem;">💓</div>
        <div class="heart" style="--left: 95%; --float-duration: 8s; --delay: 4.5s; --size: 1.2rem;">💕</div>
    </div>

    <!-- Standalone Locker Entry Page -->
    <div class="locker-container">
        <div class="locker-box">
            <h2>Private Locker 🔐</h2>
            <p>Enter your 4-digit PIN to open the memories</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
            <button class="unlock-btn" onclick="checkPin()">Unlock ✨</button>
            <div id="error-msg" class="error-msg">Incorrect PIN! Try again 💕</div>
        </div>
    </div>

    <script>
        // --- BUILT-IN MUSIC PLAYER LOGIC ---
        if (!window.__globalMemoryAudio) {
            window.__globalMemoryAudio = new Audio();
            window.__globalMemoryAudio.loop = true;
        }

        window.playMemorySong = function(songUrl) {
            if (!songUrl) return;
            const audio = window.__globalMemoryAudio;
            audio.pause();
            audio.src = songUrl;
            audio.currentTime = 0;
            audio.play().catch(err => {
                console.log("Playback prevented or file not found:", err);
            });
        };
        // -----------------------------------

        // Set your secret PIN here (currently set to "1234")
        const correctPin = "2407";
        // Set the name of your main memories HTML file page here to redirect upon success:
        const targetPage = "index_main.html"; 

        function checkPin() {
            const enteredPin = document.getElementById('pin-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (enteredPin === correctPin) {
                // Play song right inside the logic upon successful verification
                playMemorySong('./song1.mp3');

                // Smooth transition/redirect to the main memories page after a brief delay so audio starts
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    window.location.href = targetPage;
                }, 500);
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pin-input').value = '';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 2000);
            }
        }

        // Allow pressing "Enter" to unlock
        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPin();
            }
        });
    </script>
</body>

</html>
